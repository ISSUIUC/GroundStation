name: "Cassie - March 2026 Launch"
version: 2

audio_presets:
  p_a: 
    - RADIO_AUDIO
    - IPCAM_1
    - IPCAM_2
  p_b:
    - IPCAM_3
    - IPCAM_4
  mute_all: []


scenes:
  starting:
    obs_scene: "STARTING"
    description: "Starting before B-Roll starts"
    audio: p_a
  generic_host:
    obs_scene: "GENERIC_HOST"
    description: "Host camera (solo)"
    audio: p_b
  mission_overview:
    obs_scene: "MISSION_OVERVIEW"
    description: "Mission overview graphics"
  host_interviewee:
    obs_scene: "HOST_INTERVIEWEE"
    description: "Split host + interviewee"
  host_video:
    obs_scene: "HOST_VIDEO"
    description: "initalVideo"
  team_photo:
    obs_scene: "TEAM_PHOTO_BROLL"
    description: "Team photo B-Roll"
  camera_host_pad1:
    obs_scene: "CAM_HOST_PAD1"
    description: "IPCAM + Host"
  camera_host_pad2:
    obs_scene: "CAM_HOST_PAD2"
    description: "Host + IPCAM"
  launch_scene:
    obs_scene: "ROCKET_LIVE"
    description: "Launch camera"
  ipcam_1:
    obs_scene: "IPCAM_1"
    description: "Ground Station Camera"
  ipcam_2:
    obs_scene: "IPCAM_2"
    description: "Pad Camera"
  thank_you:
    obs_scene: "THANK_YOU"
    description: "Thank you / static"
  i_live:
    obs_scene: "INTEGRATION_LIVE"
    description: "Test scene"

presets:
  - id: testA
    name: "Test (A) backend"
    description: "T(A)"
    scene: i_live
    audio: p_a
    overlay_state:
      spot_overlay: false
      top_timer: false
      timeline: false
      target_desc: false
  - id: testB
    name: "Test (B) backend"
    description: "T(B)"
    scene: i_live
    audio: p_b
    overlay_state:
      spot_overlay: false
      top_timer: true
      timeline: false
      target_desc: true
  - id: testC
    name: "Test (C) backend"
    description: "T(C)"
    scene: i_live
    audio:
      - IPCAM_1
      - IPCAM_4
    overlay_state:
      spot_overlay: true
      top_timer: true
      timeline: true
      target_desc: true
  - id: starting
    name: "Stream starting soon landing page"
    description: "Prestream"
    scene: starting
    overlay_state:
      spot_overlay: false
      top_timer: false
      timeline: false
      target_desc: false

  - id: broll_cycle
    name: "B-Roll Cycle"
    description: "Auto-rotate between cameras"
    scenes:
      - ipcam_1
      - ipcam_2
    cycle_interval: 20
    overlay_state:
      spot_overlay: false
      top_timer: true
      timeline: false
      target_desc: false

  - id: host_video
    name: "Inital Video"
    description: "Inital video for hosted segment"
    scene: host_video
    overlay_state:
      spot_overlay: false
      top_timer: true
      timeline: false
      target_desc: true
    target_desc:
      title: "Ajax Bachor"
      subtitle: "Stream Host"

  - id: host_solo
    name: "Host Solo"
    description: "Host camera"
    scene: generic_host
    overlay_state:
      spot_overlay: false
      top_timer: true
      timeline: false
      target_desc: true
    target_desc:
      title: "Ajax Bachor"
      subtitle: "Stream Host"

  - id: mission_overview
    name: "Mission Overview"
    description: "Graphics with host narration"
    scene: mission_overview
    overlay_state:
      spot_overlay: false
      top_timer: true
      target_desc: true
      timeline: false

  - id: interview1
    name: "Thomas's Interview"
    description: "Split host + interviewee"
    scene: host_interviewee
    overlay_state:
      spot_overlay: false
      top_timer: true
      target_desc: true
      timeline: false
    target_desc:
      title: "Thomas McManamen"
      subtitle: "Avionics Lead"

  - id: interview2
    name: "Seths's Interview"
    description: "Split host + interviewee"
    scene: host_interviewee
    overlay_state:
      spot_overlay: false
      top_timer: true
      target_desc: true
      timeline: false
    target_desc:
      title: "Seth Blumenthal"
      subtitle: "Structural Design & Analysis Sublead"

  - id: interview3
    name: "Andrews's Interview"
    description: "Split host + interviewee"
    scene: host_interviewee
    overlay_state:
      spot_overlay: false
      top_timer: true
      target_desc: true
      timeline: false
    target_desc:
      title: "Andrew Kern"
      subtitle: "Recovery Lead"

  - id: interview4
    name: "Michael's Interview"
    description: "Split host + interviewee"
    scene: host_interviewee
    overlay_state:
      spot_overlay: false
      top_timer: true
      target_desc: true
      timeline: false
    target_desc:
      title: "Michael Karpov"
      subtitle: "Operations Lead"

  - id: interview5
    name: "Ashley's Interview"
    description: "Split host + interviewee"
    scene: host_interviewee
    overlay_state:
      spot_overlay: false
      top_timer: true
      target_desc: true
      timeline: false
    target_desc:
      title: "Ashley Sawa"
      subtitle: "Spaceshot Lead"

  - id: team_photo
    name: "Team Photo B-Roll"
    description: "Team photo footage"
    scene: team_photo
    overlay_state:
      spot_overlay: false
      top_timer: true
      target_desc: false
      timeline: true

  - id: prelaunch_IP
    name: "Prelaunch DLSR"
    description: "DLSR for launch"
    scene: camera_host_pad1
    overlay_state:
      spot_overlay: false
      top_timer: true
      timeline: false
      target_desc: false
      telemetry: true

  - id: prelaunch_Webcam
    name: "Prelaunch Webcam"
    description: "Webcam + DLSR for launch"
    scene: camera_host_pad2
    overlay_state:
      spot_overlay: false
      top_timer: true
      timeline: false
      target_desc: false
      telemetry: true

  - id: launch
    name: "OpenStreetView Telemetry"
    description: "OpenStreetView visualization"
    scene: launch_scene
    overlay_state:
      spot_overlay: true
      top_timer: false
      timeline: false
      target_desc: false
      telemetry: true

  - id: thank_you
    name: "Thank You / End"
    description: "Static thank-you screen"
    scene: thank_you
    overlay_state:
      spot_overlay: false
      top_timer: false
      timeline: false
      target_desc: false
